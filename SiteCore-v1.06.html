<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SiteCore</title>
<meta name="application-version" content="1.06">
<meta name="description" content="SiteCore — construction field quality, drawings, punch list, inspections and PDF reporting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>/* theme before first paint */try{var t=localStorage.getItem('sitecore.theme')||'auto';document.documentElement.dataset.theme=(t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t);}catch(e){document.documentElement.dataset.theme='light';}</script>
<style>
:root{
  --navy:#0f1f35;--navy2:#172c4d;--navy3:#23406b;--accent:#f59e0b;--accent2:#d97706;
  --bg:#eef1f6;--panel:#ffffff;--panel2:#f7f9fc;--line:#e2e7ef;--line2:#cfd7e3;
  --text:#1b2533;--muted:#687589;--blue:#2563eb;--red:#dc2626;--green:#16a34a;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --soft:#475569;--hl:#fff4dc;--hl2:#fff7e8;--hlt:#9a5b00;--field:#fff;--bar:#fff;
  color-scheme:light;
  --r:10px;
  /* Safe areas: Capacitor injects --safe-area-inset-* (Android); browsers / iOS provide env(). Divided by the page scale. */
  --ps:1;
  --it:calc(var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) / var(--ps));
  --ib:calc(var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)) / var(--ps));
  --il:calc(var(--safe-area-inset-left, env(safe-area-inset-left, 0px)) / var(--ps));
  --ir:calc(var(--safe-area-inset-right, env(safe-area-inset-right, 0px)) / var(--ps));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 "Segoe UI","Noto Sans Lao","Noto Sans Thai","Leelawadee UI","Lao UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.3}
.muted{color:var(--muted)}
.boot-load{height:100%;min-height:60vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.spin.dark{border-color:rgba(15,31,53,.15);border-top-color:var(--accent)}
.grid>*{min-width:0}.card{min-width:0}
.i{flex:none;display:inline-block;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn .i,.nav-i .i{vertical-align:middle}
.big-ic{color:#94a3b8}
.slot-pos{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;color:#fff;background:#64748b;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
small{font-size:12px}

.top{height:calc(56px + var(--it));background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:var(--it) calc(14px + var(--ir)) 0 calc(14px + var(--il));border-bottom:3px solid var(--accent)}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.logo-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#fbbf24);color:var(--navy);display:grid;place-items:center;font-weight:800;letter-spacing:-.5px}
.brand b{font-size:17px;display:block;letter-spacing:.2px}
.brand small{color:#9fb0c8;display:block;font-size:11px;margin-top:-2px}
.proj{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.proj select,.lang-sel{background:var(--navy2);border:1px solid var(--navy3);color:#fff;border-radius:8px;padding:7px 10px;max-width:360px;min-width:0}
.top-act{display:flex;gap:8px;align-items:center}
.user-chip{background:var(--navy2);border:1px solid var(--navy3);color:#dbe5f3;border-radius:20px;padding:6px 12px;cursor:pointer;white-space:nowrap}

.shell{display:grid;grid-template-columns:220px 1fr;height:calc(100vh / var(--z, 1) - 56px - var(--it));height:calc(100dvh / var(--z, 1) - 56px - var(--it));padding:0 var(--ir) var(--ib) var(--il)}
nav{background:#fff;border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-i{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;color:#334155;font-weight:500}
.nav-i:hover{background:var(--panel2)}
.nav-i.on{background:#fff7e8;color:#9a5b00;box-shadow:inset 3px 0 0 var(--accent)}
.nav-i .ic{width:20px;text-align:center}
.nav-foot{margin-top:auto;padding:10px 12px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
main{overflow:auto;min-width:0;position:relative}
main.full{overflow:hidden}

.page{padding:20px 24px 40px;max-width:1500px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:21px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-h h3{font-size:14.5px}
.card-b{padding:14px 16px}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent2);color:#1c1300}
.btn.primary:hover{background:#fbbf24}
.btn.danger{color:var(--red);border-color:#f3c4c4}
.btn.danger:hover{background:#fef2f2}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.25);color:#e2e8f0}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,.fl input,.fl select,.fl textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff;outline:none}
.input:focus,.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.fl{display:block;font-size:12.5px;font-weight:600;color:#475569;margin-bottom:10px}
.fl>input,.fl>select,.fl>textarea{margin-top:4px;font-weight:400;color:var(--text);font-size:14px}
.fl.chk{display:flex;align-items:center;gap:8px}
.fl.chk input{width:auto;margin:0}
.fl .hint{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700;color:#fff;background:var(--c,#64748b);white-space:nowrap}
.badge.tag{border-radius:6px;font-family:Consolas,ui-monospace,monospace;letter-spacing:.2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.chip.off{opacity:.4}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty-sm{padding:6px 12px;color:var(--muted);font-size:12.5px}
.empty-sm a{color:#b45309;cursor:pointer}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;background:var(--panel2);color:#475569;font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fffaf0}
.overdue{color:var(--red);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .input{width:auto;min-width:130px;padding:6px 9px}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .s{font-size:12px;color:var(--muted)}
.stack{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--line)}
.stack span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;background:var(--green)}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;display:flex;gap:10px}
.feed li:last-child{border:0}
.feed time{color:var(--muted);font-size:11.5px;white-space:nowrap;min-width:92px}
.logo-strip{display:flex;gap:10px;align-items:center}
.logo-strip img{height:40px;max-width:120px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px}

.drawings{display:grid;grid-template-columns:300px minmax(0,1fr) 290px;height:100%;position:relative}
.tree-panel,.tag-panel{background:#fff;display:flex;flex-direction:column;min-height:0}
.tree-panel{border-right:1px solid var(--line)}
.tag-panel{border-left:1px solid var(--line)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);gap:8px}
.tree{overflow:auto;flex:1;padding:6px 0}
.trow{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 8px;cursor:pointer;border-radius:6px;margin:1px 6px;font-size:13px;min-height:30px}
.trow:hover{background:var(--panel2)}
.trow.on{background:#fff4dc;font-weight:600}
.trow .caret{width:12px;color:var(--muted);font-size:11px;flex:none}
.trow .dot{width:10px;height:10px;border-radius:3px;flex:none}
.trow .tlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.lv0 .tlabel{font-weight:700;letter-spacing:.2px}
.trow.lv1 .tlabel{font-weight:600}
.trow.lvs .tlabel{color:#1e3a5f}
.trow .tact{display:none;gap:1px}
.trow:hover .tact,.trow.on .tact{display:flex}
.tact button{border:0;background:none;cursor:pointer;padding:2px 4px;border-radius:4px;color:#64748b;font-size:12px}
.tact button:hover{background:#e8edf4;color:var(--text)}
.tchildren{padding-left:13px;border-left:1px dashed #e0e6ee;margin-left:14px}
.cnt{font-size:11px;background:var(--line);border-radius:10px;padding:0 7px;color:#475569;font-weight:600;flex:none}
.cnt.open{background:#fde7e7;color:#b91c1c}
.viewer-wrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.viewer-bar{background:#fff;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.crumbs{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs .sep{color:var(--muted)}
.vtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 11px;cursor:pointer;font-weight:500;font-size:13px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--navy);color:#fff}
.seg button.on.add{background:var(--accent);color:#1c1300}
.viewport{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;
  background-color:#d9dfe7;background-image:linear-gradient(45deg,#d3dae3 25%,transparent 25%,transparent 75%,#d3dae3 75%),linear-gradient(45deg,#d3dae3 25%,transparent 25%,transparent 75%,#d3dae3 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.viewport.add{cursor:crosshair}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage img{display:block;user-select:none;-webkit-user-drag:none;box-shadow:0 4px 30px rgba(0,0,0,.25);background:#fff}
#pins{position:absolute;left:0;top:0}
.pin{position:absolute;width:0;height:0;transform:scale(var(--inv,1));transform-origin:0 0;z-index:2}
.pin-label{position:absolute;left:0;bottom:8px;transform:translateX(-50%);background:var(--c);color:#fff;font:700 12px/1 Consolas,ui-monospace,monospace;padding:5px 7px;border-radius:7px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);white-space:nowrap;cursor:pointer}
.pin-label::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top:7px solid #fff}
.pin-dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.pin.sel{z-index:5}
.pin.sel .pin-label{outline:3px solid var(--accent);outline-offset:1px}
.vp-empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#475569;text-align:center;padding:20px}
.mode-hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(15,31,53,.9);color:#fff;padding:6px 14px;border-radius:20px;font-size:12.5px;pointer-events:none;display:none}
.viewport.add .mode-hint{display:block}
.tag-list{overflow:auto;flex:1;padding:6px}
.tag-item{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.tag-item:hover{background:var(--panel2)}
.tag-item.on{border-color:var(--accent);background:#fffaf0}
.tag-item .ti{flex:1;min-width:0}
.tag-item .ti b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-item .ti small{color:var(--muted)}
.panel-toggle{display:none}

.ov{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:calc(16px + var(--it)) calc(16px + var(--ir)) calc(16px + var(--ib)) calc(16px + var(--il))}
.modal{background:#fff;border-radius:12px;width:min(520px,100%);max-height:calc(100dvh / var(--z, 1) - 32px - var(--it) - var(--ib));display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(820px,100%)}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-head h3{font-size:16px}
.m-head .x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
.m-body{padding:16px 18px;overflow:auto}
.m-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:0 0 12px 12px;flex-wrap:wrap}
.loc-line{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.field-l{font-size:12.5px;font-weight:600;color:#475569;margin:2px 0 5px}
.status-seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.status-seg button{border:1.5px solid var(--c);color:var(--c);background:#fff;border-radius:20px;padding:5px 12px;font-weight:600;cursor:pointer;font-size:12.5px}
.status-seg button.on{background:var(--c);color:#fff}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.ph{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#e5e9f0;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.ph .ph-x{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(15,31,53,.75);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.ph-tools{position:absolute;left:4px;right:4px;bottom:4px;display:flex;gap:4px;justify-content:space-between}
.ph-tools button{border:0;border-radius:5px;background:rgba(15,31,53,.8);color:#fff;font-size:10.5px;font-weight:600;padding:2px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.ph-tools .ph-kind.Before{background:#d97706}.ph-tools .ph-kind.After{background:#16a34a}
.mk-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mk-bar .btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mk-sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.mk-sw.on{box-shadow:0 0 0 2px var(--navy)}
.mk-wrap{background:#1f2937;border-radius:8px;display:flex;justify-content:center;padding:8px}
.mk-wrap canvas{max-width:100%;max-height:60vh;touch-action:none;cursor:crosshair;background:#fff}
.credit{margin-top:8px;font-size:10.5px;color:#94a3b8;letter-spacing:.2px}
.bulkbar{display:none;gap:8px;align-items:center;flex-wrap:wrap;background:#fff8e6;border:1px solid #f5d9a0;border-radius:10px;padding:8px 12px;margin-bottom:10px}
.bulkbar.on{display:flex}.bulkbar .input{width:auto;padding:5px 8px}
.tbl td.cb,.tbl th.cb{width:34px;text-align:center}.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent2);cursor:pointer}
.ph-add{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:4/3;border:2px dashed var(--line2);border-radius:8px;cursor:pointer;color:var(--muted);font-size:12.5px;text-align:center;gap:2px}
.ph-add:hover{border-color:var(--accent);color:var(--accent2)}
.comments{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin-bottom:8px;background:var(--panel2)}
.cm{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.cm:last-child{border:0}
.cm .meta{font-size:11.5px;color:var(--muted)}
.cm.sys{color:#475569;font-style:italic}
.cm-add{display:flex;gap:8px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:var(--it) var(--ir) var(--ib) var(--il)}
.lightbox img{max-width:95vw;max-height:92vh;box-shadow:0 0 40px #000}

.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow:auto;padding-bottom:10px}
.col{background:#e6eaf1;border-radius:10px;display:flex;flex-direction:column;min-height:300px}
.col.drag{outline:2px dashed var(--accent)}
.col-h{padding:10px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;border-top:4px solid var(--c);border-radius:10px 10px 0 0}
.col-b{padding:0 8px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.kcard{background:#fff;border-radius:8px;padding:9px 10px;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:grab;border-left:4px solid var(--c)}
.kcard b{display:block;font-size:13px;margin:4px 0 2px}
.kcard small{color:var(--muted);display:block}

.res{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.res button{border:0;background:#fff;padding:5px 10px;cursor:pointer;font-size:12.5px;font-weight:600;color:#475569}
.res button+button{border-left:1px solid var(--line2)}
.res button.on[data-r="Pass"]{background:var(--green);color:#fff}
.res button.on[data-r="Fail"]{background:var(--red);color:#fff}
.res button.on[data-r="N/A"]{background:#64748b;color:#fff}
.result-pill{font-weight:800;letter-spacing:.5px;padding:4px 12px;border-radius:6px;color:#fff;background:var(--c)}

.rtree .rrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.rtree .rrow.lv0{background:var(--panel2);font-weight:700}
.rtree .rrow.lv1{font-weight:600}

function migrate(s) {

  if (Array.isArray(s.disciplines) || Array.isArray(s.floors)) {

    ds.forEach(d => s.nodes.push({id:d.id, projectId:d.projectId, parentId:null, name:d.name, code:d.code || '', color:d.color || DISC_COLORS[0], order:d.order}));

    s.layouts.forEach(l => { if (!l.nodeId) l.nodeId = l.floorId; delete l.floorId; });
    s.inspections.forEach(x => { if (!x.nodeId) x.nodeId = x.floorId || x.disciplineId || ''; });
    delete s.disciplines; delete s.floors; s.version = 2;
  }
  s.projects.forEach(p => { if (p.logoId && !p.contractorLogoId) { p.contractorLogoId = p.logoId; } delete p.logoId; });

}

/** Generic bottom action sheet. items: [key, icon, label, danger?]. Resolves with the chosen key or null. */
function actionSheet(title, items) {

    const ov = modal({title, body:`<div class="sheet-list">${items.map(([k, icon, label, danger, on]) => `<button class="sheet-i ${danger ? 'danger' : ''} ${on ? 'on' : ''}" data-k="${k}">${ic(icon, 19)}<span>${esc(label)}</span></button>`).join('')}</div>`});
    ov._onclose = () => res(null);

  });
}

async function treeAction(act, id) {

    const k = await actionSheet(nodeLabel(n), [['addChild', 'plus', lv === 0 ? L('Add floor / level') : L('Add sub-system')], ...(lv > 0 ? [['upload', 'upload', L('Upload layout (PDF / JPG / PNG)')]] : []),
      ['edit', 'edit', L('Edit')], ['up', 'up', L('Move up')], ['del', 'trash', L('Delete'), true]]);
    return k && treeAction(k, id); }
  if (act === 'lmenu') { const k = await actionSheet(l.name, [['open', 'map', L('Open layout')], ['editLayout', 'edit', L('Layout info')], ['delLayout', 'trash', L('Delete'), true]]);

/** Photo markup editor: pen, arrow, box, ellipse, text; colours; undo. Resolves with a JPEG data URL or null. */
function openMarkup(src) {
  return new Promise(async res => {
    if (!src) return res(null); const im = await loadImage(src);
    const COLS = ['#ef4444', '#f59e0b', '#22c55e', '#2563eb', '#111827', '#ffffff'], TOOLS = [['pen', 'scribble', 'Pen'], ['arrow', 'arrow', 'Arrow'], ['rect', 'square', 'Box'], ['ellipse', 'circle', 'Ellipse'], ['text', 'type', 'Text']];
    const ov = modal({title:ic('pen') + ' ' + L('Photo markup'), cls:'wide', body:`<div class="mk-bar">
        ${TOOLS.map(([k, icon, lab], n) => `<button type="button" class="btn sm ${n ? '' : 'on'}" data-tool="${k}">${ic(icon)} ${L(lab)}</button>`).join('')}
        <span style="width:8px"></span>${COLS.map((c, n) => `<button type="button" class="mk-sw ${n ? '' : 'on'}" data-col="${c}" style="background:${c}" title="${c}"></button>`).join('')}
        <select class="input" id="mkW" style="width:auto;padding:4px 6px" title="${L('Line width')}">${opt([[1, L('Thin')], [2, L('Medium')], [3, L('Thick')]], 2)}</select>
        <span class="sp"></span><button type="button" class="btn sm" id="mkUndo">${ic('undo')} ${L('Undo')}</button><button type="button" class="btn sm" id="mkClr">${ic('trash')} ${L('Clear')}</button></div>
      <div class="mk-wrap"><canvas id="mkC"></canvas></div>`,
      foot:`<span class="sp"></span><button class="btn" data-close>${L('Cancel')}</button><button class="btn primary" id="mkOk">${ic('save')} ${L('Save markup')}</button>`});
    ov._onclose = () => res(null);
    const c = $('#mkC', ov), x = c.getContext('2d'); c.width = im.naturalWidth; c.height = im.naturalHeight;
    const unit = Math.max(2, Math.round(Math.max(c.width, c.height) / 400)), shapes = []; let tool = 'pen', col = COLS[0], wk = 2, cur = null;
    const drawShape = sh => {
      x.strokeStyle = sh.col; x.fillStyle = sh.col; x.lineWidth = sh.w; x.lineCap = 'round'; x.lineJoin = 'round';
      if (sh.type === 'pen') { x.beginPath(); sh.pts.forEach(([a, b], n) => n ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke(); }
      else if (sh.type === 'arrow') { const ang = Math.atan2(sh.y1 - sh.y0, sh.x1 - sh.x0), hl = sh.w * 4.5; x.beginPath(); x.moveTo(sh.x0, sh.y0); x.lineTo(sh.x1, sh.y1); x.stroke();
        x.beginPath(); x.moveTo(sh.x1, sh.y1); x.lineTo(sh.x1 - hl * Math.cos(ang - 0.45), sh.y1 - hl * Math.sin(ang - 0.45)); x.lineTo(sh.x1 - hl * Math.cos(ang + 0.45), sh.y1 - hl * Math.sin(ang + 0.45)); x.closePath(); x.fill(); }
      else if (sh.type === 'rect') x.strokeRect(Math.min(sh.x0, sh.x1), Math.min(sh.y0, sh.y1), Math.abs(sh.x1 - sh.x0), Math.abs(sh.y1 - sh.y0));
      else if (sh.type === 'ellipse') { x.beginPath(); x.ellipse((sh.x0 + sh.x1) / 2, (sh.y0 + sh.y1) / 2, Math.abs(sh.x1 - sh.x0) / 2, Math.abs(sh.y1 - sh.y0) / 2, 0, 0, Math.PI * 2); x.stroke(); }
      else if (sh.type === 'text') { x.font = `bold ${sh.w * 7}px "Segoe UI","Noto Sans Lao","Noto Sans Thai",Arial,sans-serif`; x.textBaseline = 'top';
        x.lineWidth = Math.max(2, sh.w * 1.2); x.strokeStyle = sh.col === '#ffffff' ? '#111827' : '#ffffff'; x.strokeText(sh.text, sh.x0, sh.y0); x.fillText(sh.text, sh.x0, sh.y0); }
    };
    const draw = () => { x.drawImage(im, 0, 0); shapes.forEach(drawShape); if (cur) drawShape(cur); };
    const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
    draw();
    $$('[data-tool]', ov).forEach(b => b.onclick = () => { tool = b.dataset.tool; $$('[data-tool]', ov).forEach(z => z.classList.toggle('on', z === b)); });
    $$('[data-col]', ov).forEach(b => b.onclick = () => { col = b.dataset.col; $$('[data-col]', ov).forEach(z => z.classList.toggle('on', z === b)); });
    $('#mkW', ov).onchange = e => wk = +e.target.value;
    $('#mkUndo', ov).onclick = () => { shapes.pop(); draw(); }; $('#mkClr', ov).onclick = () => { shapes.length = 0; draw(); };
    c.addEventListener('pointerdown', async e => {
      const [px, py] = pos(e), w = unit * wk;
      if (tool === 'text') { const r = await promptForm(L('Text'), [{k:'t', label:L('Enter text'), req:true}], L('Add')); if (r) { shapes.push({type:'text', col, w, x0:px, y0:py, text:r.t}); draw(); } return; }
      try { c.setPointerCapture(e.pointerId); } catch (er) {}
      cur = {type:tool, col, w, pts:[[px, py]], x0:px, y0:py, x1:px, y1:py};
    });
    c.addEventListener('pointermove', e => { if (!cur) return; const [px, py] = pos(e); if (cur.type === 'pen') cur.pts.push([px, py]); else { cur.x1 = px; cur.y1 = py; } draw(); });
    const up = () => { if (!cur) return; if (cur.type === 'pen' ? cur.pts.length > 1 : Math.hypot(cur.x1 - cur.x0, cur.y1 - cur.y0) > 4) shapes.push(cur); cur = null; draw(); };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    $('#mkOk', ov).onclick = () => { ov._onclose = null; const out = shapes.length ? c.toDataURL('image/jpeg', 0.85) : null; ov.close(); res(out); };
  });
}

    doc.autoTable({startY:PDF_TOP + 1, margin:{top:PDF_TOP + 1, left:10, right:10, bottom:14}, head:[[L('Date'), L('Weather'), L('Manpower'), L('Work done / progress'), L('Issues / delays / instructions'), L('By')]],
      body:entries.slice().reverse().map(x => [fmtDate(x.date), L(x.weather || ''), x.manpower, x.work, x.issues, x.by]), styles:{...TS, fontSize:7.8, cellPadding:1.8}, headStyles:{fillColor:rgb(NAVY), fontStyle:'bold'},
      columnStyles:{0:{cellWidth:22}, 1:{cellWidth:18}, 2:{cellWidth:17, halign:'center'}, 5:{cellWidth:22}}, didDrawPage:() => pdfHeader(doc, L('SITE DIARY'), p.name, [`${L('Date')}: ${fmtDate(today())}`, `${entries.length}`], meta)});
    pdfFooters(doc, p.name, footerCenter(p)); deliver(doc, `${safeName(p.code || 'SiteCore')}_Site_Diary_${today()}.pdf`, L('SITE DIARY'));
  });
}

      ${LOGO_SLOTS.map(([k, role, field], i) => `<div class="logo-slot"><h4 data-caph="${k}"><span class="slot-pos">${[L('Left'), L('Centre'), L('Right')][i]}</span>${esc(logoCaption(p, k, role) || L(role))}</h4><div class="logo-prev">${p[k] ? `<img data-fid="${p[k]}" alt="">` : `<small class="muted">${esc(p[field] || L('No logo'))}</small>`}</div>

        <label class="fl cap-fl">${L('Logo caption (topic)')}<input data-cap="${k}" value="${esc(p.logoCaps?.[k]?.text || '')}" placeholder="${esc(L(role))}"></label>
        <label class="fl chk cap-chk"><input type="checkbox" data-capon="${k}" ${p.logoCaps?.[k]?.show === false ? '' : 'checked'}> ${L('Show caption under logo')}</label></div>`).join('')}
    </div><small class="muted">${L('PNG with transparent background recommended. Without a logo, the company name is printed instead.')}</small></div></div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${L('Project information')}</h3><button class="btn primary" id="saveP">${ic('save')} ${L('Save')}</button></div><div class="card-b"><div class="grid2">
      ${[['name', 'Project name'], ['code', 'Project No. / code'], ['client', 'Owner / Client'], ['location', 'Location'], ['consultant', 'Consultant'], ['contractor', 'Contractor'], ['manager', 'Project manager'], ['startDate', 'Start date', 'date'], ['reportTitle', 'Report title (default: PUNCH LIST REPORT)'], ['footerNote', 'Report footer note']]
        .map(([k, lab, t]) => `<label class="fl">${L(lab)}<input data-p="${k}" type="${t || 'text'}" value="${esc(p[k] || '')}"></label>`).join('')}</div>
      <label class="fl chk" style="margin-top:4px"><input type="checkbox" id="showCredit" ${p.showCredit !== false ? 'checked' : ''}> ${L('Show footer credit')}: <span class="muted">${CREDIT}</span></label></div></div>
    <div class="grid set-grid" style="grid-template-columns:1fr 1fr">
      <div class="card"><div class="card-h"><h3>${ic('users')} ${L('User')}</h3></div><div class="card-b"><label class="fl">${L('Your name (shown on tags, comments & reports)')}<input id="uName" value="${esc(S.user)}"></label>
        <label class="fl">${L('Language')}<select id="uLang">${opt(Object.entries(LANGS), LANG)}</select></label>
        <label class="fl">${L('Theme')}<select id="uTheme">${opt(THEMES.map(([v, , lab]) => [v, L(lab)]), getThemePref())}</select></label>
        <label class="fl">${L('Display size (this device)')}<select id="uScale">${opt(SCALES.map(([v, t]) => [v, v === 'auto' ? `${L('Auto')} (${Math.round(autoScale() * 100)}% · ${L({'small-phone':'Small phone', phone:'Phone', tablet:'Tablet', pc:'Computer'}[deviceClass()])})` : t]), getScalePref())}</select><span class="hint">${L('Auto fits this screen: 85% small phone, 90% phone, 85–90% tablet, 90% computer. Choose a size if text looks too small or too large.')}</span></label></div></div>
      <div class="card"><div class="card-h"><h3>${ic('db')} ${L('Data & backup')}</h3><span class="muted">SiteCore v${APP_VERSION}</span></div><div class="card-b"><div class="muted" id="storageInfo">…</div>
        <p class="muted" style="margin:8px 0 0;font-size:12.5px">${L('Data is stored only on this device. Back up regularly — uninstalling the app or clearing browser data deletes it.')} ${S.lastBackup ? L('Last backup') + ': ' + fmtDT(S.lastBackup) : ''}</p>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn primary" id="bkAllBtn">${ic('download')} ${L('Back up all projects')}</button><button class="btn" id="rsBtn">${ic('upload')} ${L('Restore backup')}</button></div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn" id="dupDemo">${ic('layers')} ${L('Load sample project')}</button><button class="btn danger" id="delP">${ic('trash')} ${L('Delete this project')}</button></div></div></div>
    </div></div>`;
  hydrateImgs($('#main'));
  $('#saveP').onclick = () => { $$('[data-p]').forEach(el => p[el.dataset.p] = el.value.trim()); if (!p.name) p.name = 'Untitled project'; log('Project information updated'); save(); renderShell(); toast(L('Saved'), 'ok'); };
  $('#showCredit').onchange = e => { p.showCredit = e.target.checked; save(); renderNav(); toast(L('Saved'), 'ok'); };
  $('#uName').onchange = e => { S.user = e.target.value.trim() || 'Site Engineer'; save(); renderShell(); };
  $('#uLang').onchange = e => setLang(e.target.value);
  $('#uTheme').onchange = e => setThemePref(e.target.value);
  $('#uScale').onchange = e => { setScalePref(e.target.value); toast(L('Saved'), 'ok'); };
  $$('[data-logo]').forEach(b => b.onclick = async () => { const [f] = await pickFiles('image/*', false); if (!f) return; const r = await compressImage(await readAsDataURL(f), 800, 0.92, /png|svg|webp|gif/i.test(f.type)); const k = b.dataset.logo; if (p[k]) delFile(p[k]); p[k] = await putFile(r.dataURL); save(); renderSettings(); });
  const capOf = k => { p.logoCaps ||= {}; return p.logoCaps[k] ||= {text:'', show:true}; };
  const capHead = k => { const [, role] = LOGO_SLOTS.find(x => x[0] === k), i = LOGO_SLOTS.findIndex(x => x[0] === k); $(`[data-caph="${k}"]`).innerHTML = `<span class="slot-pos">${[L('Left'), L('Centre'), L('Right')][i]}</span>${esc(logoCaption(p, k, role) || L(role))}`; };
  $$('[data-cap]').forEach(el => el.oninput = () => { capOf(el.dataset.cap).text = el.value.trim(); save(); capHead(el.dataset.cap); });
  $$('[data-capon]').forEach(el => el.onchange = () => { capOf(el.dataset.capon).show = el.checked; save(); capHead(el.dataset.capon); });
  $$('[data-logorm]').forEach(b => b.onclick = () => { const k = b.dataset.logorm; delFile(p[k]); p[k] = null; save(); renderSettings(); });
  $('#delP').onclick = async () => { if (!await confirmBox(`${L('Permanently delete project')} <b>${esc(p.name)}</b>? ${L('Export a package first if you need a backup.')}`)) return; deleteProject(p.id); save(); go('dashboard'); };
  $('#dupDemo').onclick = loadDemo; $('#bkAllBtn').onclick = exportBackup; $('#rsBtn').onclick = importAny;
  if (navigator.storage?.estimate) navigator.storage.estimate().then(e => { const el = $('#storageInfo'); if (el) el.textContent = L('Browser storage used: {u} MB of ~{q} GB available.', {u:(e.usage / 1048576).toFixed(1), q:(e.quota / 1073741824).toFixed(1)}); });
}
function deleteProject(pid) {
  const p = S.projects.find(x => x.id === pid); if (!p) return;
  discs(pid).forEach(d => deleteNode(d.id)); LOGO_SLOTS.forEach(([k]) => delFile(p[k]));
  S.diary.filter(x => x.projectId === pid).forEach(x => x.photoIds?.forEach(delFile));
  for (const k of ['inspections', 'diary', 'logs', 'reports']) S[k] = S[k].filter(x => x.projectId !== pid);
  S.projects = S.projects.filter(x => x.id !== pid); S.currentProjectId = S.projects[0]?.id || null; UI.layoutId = null;
}
async function newProject() {
  const r = await promptForm(L('Create project'), [{k:'name', label:L('Project name'), req:true}, {k:'code', label:L('Project No. / code'), ph:'PRJ-001'}, {k:'client', label:L('Owner / Client')}, {k:'location', label:L('Location')},
    {k:'consultant', label:L('Consultant')}, {k:'contractor', label:L('Contractor')}, {k:'defaults', label:L('Create standard MEP disciplines (EE, ACMV, Plumbing, Fire Protection)'), type:'checkbox', value:true}], L('Create'));
  if (!r) return; const p = {id:uid(), name:r.name, code:r.code, client:r.client, location:r.location, contractor:r.contractor, consultant:r.consultant, createdAt:Date.now()};
  S.projects.push(p); S.currentProjectId = p.id;
  if (r.defaults) [['EE WORK', 'EE'], ['ACMV WORK', 'ME'], ['PLUMBING WORK', 'PB'], ['FIRE PROTECTION', 'FP']].forEach(([n, c], k) => S.nodes.push({id:uid(), projectId:p.id, parentId:null, name:n, code:c, color:DISC_COLORS[k], order:k}));
  log('Project created'); save(); UI.layoutId = null; go('drawings');
}
async function loadDemo() { busy('…'); try { await seedDemo(); save(); UI.layoutId = null; go('dashboard'); } finally { busy(false); } }
function setLang(l) { LANG = LANGS[l] ? l : 'en'; S.lang = LANG; save(); render(); }

// ---------- package export / import ----------
/** Builds a self-contained package (all records + files) for one project. */
async function buildPackage(p) {
  const nodes = discs(p.id).flatMap(d => [d, ...subtree(d.id)]), ls = discs(p.id).flatMap(d => layoutsUnder(d.id)), lids = new Set(ls.map(l => l.id)), iss = S.issues.filter(i => lids.has(i.layoutId)), diary = S.diary.filter(x => x.projectId === p.id);
  const fileIds = [...LOGO_SLOTS.map(([k]) => p[k]), ...ls.map(l => l.imageId), ...iss.flatMap(i => i.photoIds), ...diary.flatMap(x => x.photoIds || [])].filter(Boolean), files = {};
  for (const id of fileIds) { const v = await getFile(id); if (v) files[id] = v; }
  return {app:'SiteCore', format:2, appVersion:APP_VERSION, exportedAt:new Date().toISOString(), exportedBy:S.user, project:p, nodes, layouts:ls, issues:iss,
    inspections:S.inspections.filter(x => x.projectId === p.id), diary, logs:S.logs.filter(x => x.projectId === p.id), reports:S.reports.filter(x => x.projectId === p.id), templates:S.templates, files};
}
async function exportBackup() {
  if (!S.projects.length) return toast(L('Nothing to export'), 'err'); busy(L('Packaging project…'));
  try { const packages = []; for (const p of S.projects) packages.push(await buildPackage(p));
    await saveFile(new Blob([JSON.stringify({app:'SiteCore', format:'backup', appVersion:APP_VERSION, exportedAt:new Date().toISOString(), packages})], {type:'application/json'}), `SiteCore_Backup_${today()}.sitecore.json`);
    S.lastBackup = Date.now(); save(); toast(L('Backup created ({n} projects)', {n:packages.length}), 'ok'); if (UI.view === 'settings') renderSettings();
  } catch (e) { toast(e.message, 'err'); } finally { busy(false); }
}
async function exportPackage() {
  const p = P(); if (!p) return; busy(L('Packaging project…'));
  try {
    const pkg = await buildPackage(p);
    await saveFile(new Blob([JSON.stringify(pkg)], {type:'application/json'}), `${safeName(p.code || p.name)}_${today()}.sitecore.json`);
    log('Project package exported for sharing'); save(); toast(L('Package exported — send this file to the office / field team'), 'ok');
  } catch (e) { toast(e.message, 'err'); } finally { busy(false); }
}
/** Imports a project package or a full backup (several packages). */
async function importAny() {
  const [file] = await pickFiles(IS_NATIVE ? '*/*' : '.json,application/json', false); if (!file) return;
  let data; try { data = JSON.parse(await file.text()); if (data.app !== 'SiteCore') throw 0; } catch (e) { return toast(L('Not a valid SiteCore package file'), 'err'); }
  if (data.format === 'backup') {
    if (!await confirmBox(L('Restore {n} project(s) from this backup? Projects that already exist will be replaced.', {n:data.packages.length}), L('Restore'), false)) return;
    for (const pkg of data.packages) await importPackage(pkg, S.projects.some(p => p.id === pkg.project.id) ? 'replace' : 'copy', true);
    save(); go('dashboard'); return toast(L('Backup restored'), 'ok');
  }
  return importPackage(data);
}
async function importPackage(pkg, forceMode, quiet) {
  if (!pkg || !pkg.project) return importAny();
  if (!pkg.nodes) { // v1 package → convert
    const ds = pkg.disciplines || [], fs = pkg.floors || [];
    pkg.nodes = [...ds.map(d => ({...d, parentId:null})), ...fs.map(f => ({id:f.id, projectId:pkg.project.id, parentId:f.disciplineId, name:f.name, code:'', order:f.order}))];
    pkg.layouts.forEach(l => { l.nodeId ||= l.floorId; }); (pkg.inspections || []).forEach(x => { x.nodeId ||= x.floorId || x.disciplineId || ''; });
    if (pkg.project.logoId) { pkg.project.contractorLogoId = pkg.project.logoId; delete pkg.project.logoId; }
  }
  const exists = S.projects.some(p => p.id === pkg.project.id); let mode = forceMode || 'copy';
  if (exists && !forceMode) {
    mode = await new Promise(res => { const ov = modal({title:L('Project already exists'), body:`<p style="margin-top:0"><b>${esc(pkg.project.name)}</b></p><p class="muted">${esc(new Date(pkg.exportedAt).toLocaleString())} · ${esc(pkg.exportedBy || '—')}</p>`,
      foot:`<button class="btn" data-close>${L('Cancel')}</button><span class="sp"></span><button class="btn" data-m="copy">${L('Import as copy')}</button><button class="btn primary" data-m="replace">${L('Replace with package')}</button>`});
      ov._onclose = () => res(null); $$('[data-m]', ov).forEach(b => b.onclick = () => { ov._onclose = null; ov.close(); res(b.dataset.m); }); });
    if (!mode) return;
  }
  busy(L('Importing package…'));
  try {
    const copyName = mode === 'copy' && exists;
    const map = new Map(); const nid = id => { if (!id) return id; if (mode === 'replace') return id; if (!map.has(id)) map.set(id, (String(id).startsWith('f_') ? 'f_' : '') + uid()); return map.get(id); };
    if (mode === 'replace') deleteProject(pkg.project.id);
    for (const [id, v] of Object.entries(pkg.files || {})) { const n = nid(id); FC.set(n, v); await IDB.put('files', n, v); }
    const p = {...pkg.project, id:nid(pkg.project.id)}; LOGO_SLOTS.forEach(([k]) => p[k] = nid(p[k])); if (copyName) p.name += ' (copy)';
    S.projects.push(p);
    pkg.nodes.forEach(n => S.nodes.push({...n, id:nid(n.id), projectId:p.id, parentId:n.parentId ? nid(n.parentId) : null}));
    pkg.layouts.forEach(l => { const x = {...l, id:nid(l.id), nodeId:nid(l.nodeId), imageId:nid(l.imageId)}; delete x.floorId; S.layouts.push(x); });
    pkg.issues.forEach(i => S.issues.push({...i, id:nid(i.id), layoutId:nid(i.layoutId), photoIds:(i.photoIds || []).map(nid)}));
    (pkg.inspections || []).forEach(x => S.inspections.push({...x, id:nid(x.id), projectId:p.id, nodeId:nid(x.nodeId), layoutId:nid(x.layoutId), items:x.items.map(it => ({...it, issueId:nid(it.issueId)}))}));
    (pkg.diary || []).forEach(x => S.diary.push({...x, id:nid(x.id), projectId:p.id, photoIds:(x.photoIds || []).map(nid)}));
    (pkg.logs || []).forEach(x => S.logs.push({...x, id:nid(x.id), projectId:p.id}));
    (pkg.reports || []).forEach(x => S.reports.push({...x, id:nid(x.id), projectId:p.id, refId:x.kind === 'sel' ? String(x.refId).split(',').map(nid).join(',') : nid(x.refId)}));
    (pkg.templates || []).forEach(t => { if (!S.templates.some(x => x.name === t.name)) S.templates.push({...t, id:uid()}); });
    migrate(S); S.currentProjectId = p.id; UI.layoutId = null; log(`Project package imported (${mode}) from ${pkg.exportedBy || 'unknown'}`);
    if (quiet) return; save(); go('dashboard'); toast(L('Project imported'), 'ok');
  } catch (e) { console.error(e); toast(L('Import failed') + ': ' + e.message, 'err'); } finally { busy(false); }
}

// ---------- boot ----------
async function boot() {
  try { await IDB.open(); S = await IDB.get('meta', 'state'); } catch (e) { console.error(e); }
  const fresh = !S; if (!S) S = blankState(); migrate(S);
  if (fresh) { try { const nl = (navigator.language || 'en').slice(0, 2); if (LANGS[nl]) S.lang = nl; } catch (e) {} save(); } else save();
  LANG = LANGS[S.lang] ? S.lang : 'en';
  if (!S.projects.some(p => p.id === S.currentProjectId)) S.currentProjectId = S.projects[0]?.id || null;
  restoreUI(); try { navigator.storage?.persist?.(); } catch (e) {}
  $('#nav').addEventListener('click', e => { if (e.target.closest('#navMore')) return openMoreSheet(); const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });
  $('#projSel').onchange = e => { S.currentProjectId = e.target.value; UI.layoutId = null; UI.inspId = null; UI.repSel.clear(); save(); render(); };
  $('#langSel').onchange = e => setLang(e.target.value);
  $('#themeBtn').onclick = () => setThemePref(themeNow() === 'dark' ? 'light' : 'dark'); applyTheme();
  $('#newProj').onclick = newProject; $('#pkgExport').onclick = exportPackage; $('#pkgImport').onclick = importAny;
  $('#userChip').onclick = async () => { const r = await promptForm(L('Your name'), [{k:'user', label:L('Your name (shown on tags, comments & reports)'), value:S.user, req:true}]); if (r) { S.user = r.user; save(); renderShell(); } };
  render();
  if (IS_NATIVE) { // navy status bar with light icons; gesture-bar icons matched to what is behind them
    const SB = capPlugin('SystemBars');
    window.styleSystemBars = () => { if (!SB) return;
      const edge = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-top')) > 0; // page drawn behind the bars
      SB.setStyle({style:'DARK', bar:'StatusBar'}).catch(() => {}); SB.setStyle({style:edge && themeNow() === 'light' ? 'LIGHT' : 'DARK', bar:'NavigationBar'}).catch(() => {}); };
    styleSystemBars(); setTimeout(styleSystemBars, 800); addEventListener('resize', () => setTimeout(styleSystemBars, 300));
  }
  const AppP = IS_NATIVE && capPlugin('App');
  if (AppP) AppP.addListener('backButton', () => { // Android back: close preview / dialog, then go to dashboard, then exit
    const lb = $('.lightbox'); if (lb) return lb.remove();
    const pv = $('.pv'); if (pv && pv.close) return pv.close();
    const ov = modalStack[modalStack.length - 1]; if (ov) { const h = ov._onclose; ov._onclose = null; h && h(); return ov.close(); }
    const drw = $('#drw'); if (drw && (drw.classList.contains('show-tree') || drw.classList.contains('show-tags'))) return drw.classList.remove('show-tree', 'show-tags');
    if (UI.view === 'drawings' && UI.mode === 'add') return setMode('select');
    if (UI.view !== 'dashboard' && P()) return go('dashboard'); AppP.exitApp();
  });
  if (!IS_NATIVE && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel=manifest]'))
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
}
boot();
